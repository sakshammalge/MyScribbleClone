# Render Blueprint for Inkling. Game state lives in memory, so run exactly one instance.
# All-time stats and the leaderboard live in Postgres so they survive restarts and deploys.
# The free database expires about 30 days after it is created: upgrade its plan in the Render
# dashboard before then (or the stats are deleted), and change `plan` here to match.
databases:
  - name: inkling-db
    plan: free
    databaseName: inkling
    user: inkling
    ipAllowList: [] # only reachable from inside Render

services:
  - type: web
    name: inkling
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free # sleeps after ~15 min idle; rooms are lost on sleep or redeploy
    numInstances: 1
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: INKLING_LAN
        value: '0'
      - key: INKLING_TRUST_PROXY
        value: '1'
      - key: DATABASE_URL
        fromDatabase:
          name: inkling-db
          property: connectionString
